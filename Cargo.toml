[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "tls-rustls", "json"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Password hashing (Argon2)
argon2 = "0.5"

# JWT authentication
jsonwebtoken = "9"

# Environment variables
dotenvy = "0.15"

# HTTP utilities (CORS, logging)
tower-http = { version = "0.6", features = ["cors", "trace"] }
http = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Email (Resend API). rustls rather than the default native-tls: native-tls
# links openssl, which makes the binary depend on whichever libssl the build
# machine had — it then fails to start on a host with a different one.
resend-rs = { version = "0.25", default-features = false, features = ["rustls-tls"] }

# Random number generation (OTP codes)
rand = "0.8"

# HTTP client (Codeforces API). same reasoning as resend-rs — the default
# feature set selects native-tls, so it is disabled and rustls named instead.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "charset",
    "http2",
    "system-proxy",
] }

# PDF generation (ranker results)
genpdf = "0.2"

# UUID (session IDs for PDF downloads)
uuid = { version = "1", features = ["v4"] }

# Async utilities (try_join_all for parallel fetching)
futures = "0.3"


# ID card images: decode to validate, resize, re-encode (which drops EXIF)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }


[profile.release]
# most of the unstripped binary is debug symbols we never read in production —
# backtraces come from the logs, not from the deployed artefact
strip = true

# thin lto gets nearly all the cross-crate inlining of full lto for a fraction
# of the link time
lto = "thin"

# one codegen unit lets the optimiser see the whole crate. slower to build,
# which is a cost paid by CI rather than by anyone waiting.
codegen-units = 1

# deliberately NOT panic = "abort". it would shrink the binary further, but a
# panic in one request handler would take the whole server down instead of
# failing that single request.
