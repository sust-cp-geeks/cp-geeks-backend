name: CI

# Runs on both branches: dev is where work lands, main is what gets deployed,
# and a merge to main should never be the first time the tests run.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build, test, lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # rustls' crypto backend (aws-lc-sys) compiles from C. the github runner
      # image ships both today, but naming them here means a future image that
      # drops one fails with an obvious message rather than a confusing
      # compile error deep inside a dependency.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      # deliberately no dtolnay/rust-toolchain step. that action exports
      # RUSTUP_TOOLCHAIN, which silently outranks rust-toolchain.toml — the
      # version would be pinned in the repo and ignored here. the runner already
      # has rustup, so letting it read rust-toolchain.toml keeps one source of
      # truth for the version, shared with every laptop.
      - name: Show toolchain
        run: rustc --version && cargo clippy --version

      # without this every run recompiles the whole dependency tree
      - uses: Swatinem/rust-cache@v2

      # --locked so CI builds the exact dependency versions in Cargo.lock
      # rather than silently resolving newer ones
      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: cargo test --locked

      # enforced, and safe to enforce only because rust-toolchain.toml pins the
      # compiler. the baseline is zero warnings, so a warning here comes from
      # the change being tested — it can no longer come from stable moving
      # underneath us, which is what broke this job once already.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
