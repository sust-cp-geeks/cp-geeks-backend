name: CI

# Runs on both branches: dev is where work lands, main is what gets deployed,
# and a merge to main should never be the first time the tests run.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build, test, lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # rustls' crypto backend (aws-lc-sys) compiles from C. the github runner
      # image ships both today, but naming them here means a future image that
      # drops one fails with an obvious message rather than a confusing
      # compile error deep inside a dependency.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # without this every run recompiles the whole dependency tree
      - uses: Swatinem/rust-cache@v2

      # --locked so CI builds the exact dependency versions in Cargo.lock
      # rather than silently resolving newer ones
      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: cargo test --locked

      # enforced. the baseline is zero, so any warning here is something this
      # change introduced — which is the only state in which a lint gate is
      # worth having. it was advisory while 25 known warnings drowned out
      # anything new.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
